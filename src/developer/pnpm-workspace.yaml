packages:
  - 'functions'
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@ugrc/*'
  - qs@6.16.0
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  '@vaadin/vaadin-usage-statistics': true
  esbuild: true
  protobufjs: true
  re2: true
  unrs-resolver: true
