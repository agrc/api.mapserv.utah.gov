packages:
  - 'functions'
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@ugrc/*'
  - qs@6.15.4 || 6.16.0 || 6.16.1
  - node-forge@1.4.1
  - joi@18.3.1
  - minimatch@11.0.1
  - glob@14.0.2
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  '@vaadin/vaadin-usage-statistics': true
  esbuild: true
  protobufjs: true
  re2: true
  unrs-resolver: true
