name: Push Events

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-main:
    name: Release PR (main)
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 🪙 Convert token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.UGRC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.UGRC_RELEASE_BOT_APP_KEY }}

      - name: ⬇️ Set up code
        uses: actions/checkout@v7

      - name: 🚀 Create release
        uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Keep dev's pre-release versions ahead of what main has released so
      # dev never proposes a version (or tag) that already exists.
      - name: ⬇️ Set up dev
        if: steps.release-please.outputs.releases_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: 🔄 Sync dev manifest
        if: steps.release-please.outputs.releases_created == 'true'
        working-directory: dev
        run: |
          node ../.github/scripts/sync-dev-manifest.mjs ../.release-please-manifest.json .release-please-manifest.dev.json
          if git diff --quiet; then
            echo "dev manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync dev release manifest with main"
          git push origin dev

  release-dev:
    name: Pre-release PR (dev)
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: 🪙 Convert token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.UGRC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.UGRC_RELEASE_BOT_APP_KEY }}

      - name: ⬇️ Set up code
        uses: actions/checkout@v7

      - name: 🚀 Create pre-release
        uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: dev
          config-file: release-please-config.dev.json
          manifest-file: .release-please-manifest.dev.json

  test-api:
    name: API unit tests
    uses: ./.github/workflows/pull_request.api.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
