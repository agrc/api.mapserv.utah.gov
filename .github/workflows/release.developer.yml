name: Release Events (Developer)

on:
  release:
    types:
      - published

defaults:
  run:
    working-directory: src/developer

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-unit:
    name: 🧪 Unit tests
    if: ${{ startsWith(github.ref, 'refs/tags/developer') }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/developer/pnpm-lock.yaml

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test

  deploy-prod:
    name: 🚀 Production deployment
    if: ${{ startsWith(github.ref, 'refs/tags/developer') }}
    runs-on: ubuntu-latest
    needs: [test-unit]
    environment:
      name: prod

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/developer/pnpm-lock.yaml

      - name: 📥 Download dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 📃 Configure 3rd party notice
        uses: agrc/third-party-notice-composite-action@v1
        with:
          working-directory: src/developer

      - name: 🏗 Run build command
        shell: bash
        run: pnpm build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          VITE_API_EXPLORER_URL: ${{ vars.API_EXPLORER_URL }}

      - name: 🔢 Get firebase version
        id: cache-settings
        run: |
          echo "firebase-tools=$(pnpm list -s --depth=0 | grep firebase-tools | tail -n 1 | sed 's/.*@//g')" >> GITHUB_OUTPUT

      - name: 🪣 Cache firebase
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase
          key: ${{ runner.os }}-firebase-${{ steps.cache-settings.outputs.firebase-tools }}

      - name: 🗝️ Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          access_token_scopes: "email, openid, https://www.googleapis.com/auth/cloud-platform, https://www.googleapis.com/auth/firebase"
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: 📨 Create function envs
        shell: bash
        run: |
          touch ./functions/.env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> ./functions/.env

      - name: 🚀 Firebase deploy
        shell: bash
        run: pnpm exec firebase-tools deploy --project ${{ secrets.PROJECT_ID }}
