name: Release Events (Developer)

on:
  release:
    types:
      - published

defaults:
  run:
    working-directory: src/developer

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-unit:
    name: 🧪 Unit tests
    if: ${{ startsWith(github.ref, 'refs/tags/developer') }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/developer/pnpm-lock.yaml

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm exec vitest --run

  deploy:
    name: 🚀 ${{ github.event.release.prerelease && 'Development' || 'Production' }} deployment
    if: ${{ startsWith(github.ref, 'refs/tags/developer') }}
    runs-on: ubuntu-latest
    needs: [test-unit]
    environment:
      name: ${{ github.event.release.prerelease && 'dev' || 'prod' }}

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 🚀 Deploy developer application
        uses: ./.github/actions/deploy-developer
        with:
          firebase_config: ${{ secrets.FIREBASE_CONFIG }}
          api_explorer_url: ${{ vars.API_EXPLORER_URL }}
          redis_host: ${{ secrets.REDIS_HOST }}
          identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account_email: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.PROJECT_ID }}
