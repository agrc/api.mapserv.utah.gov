name: Release Events (Explorer)

on:
  release:
    types:
      - published

defaults:
  run:
    working-directory: src/explorer

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 ${{ github.event.release.prerelease && 'Development' || 'Production' }} deployment
    if: ${{ startsWith(github.ref, 'refs/tags/explorer') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.release.prerelease && 'dev' || 'prod' }}

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 🚀 Deploy Explorer application
        uses: ./.github/actions/deploy-explorer
        with:
          self_service_url: ${{ vars.SELF_SERVICE_URL }}
          identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account_email: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.PROJECT_ID }}
