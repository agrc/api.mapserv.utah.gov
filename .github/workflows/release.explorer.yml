name: Release Events (Self Service)

on:
  release:
    types:
      - published

defaults:
  run:
    working-directory: src/explorer

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 ${{ github.event.release.prerelease && 'Development' || 'Production' }} deployment
    if: ${{ startsWith(github.ref, 'refs/tags/explorer') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.release.prerelease && 'dev' || 'prod' }}

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/explorer/pnpm-lock.yaml

      - name: 📥 Download dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 📃 Configure 3rd party notice
        uses: agrc/third-party-notice-composite-action@v1
        with:
          working-directory: src/explorer

      - name: 📨 Forward environment variables
        shell: bash
        run: |
          touch ./.env
          echo "SELF_SERVICE_URL=${{ vars.SELF_SERVICE_URL }}" >> ./.env

      - name: 🏗 Run build command
        shell: bash
        run: pnpm build

      - name: 🔢 Get firebase version
        id: cache-settings
        run: |
          echo "firebase-tools=$(pnpm list -s --depth=0 | grep firebase-tools | tail -n 1 | sed 's/.*@//g')" >> GITHUB_OUTPUT

      - name: 🪣 Cache firebase
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase
          key: ${{ runner.os }}-firebase-${{ steps.cache-settings.outputs.firebase-tools }}

      - name: 🗝️ Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          access_token_scopes: "email, openid, https://www.googleapis.com/auth/cloud-platform, https://www.googleapis.com/auth/firebase"
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: 🚀 Firebase deploy
        shell: bash
        run: pnpm exec firebase-tools deploy --project ${{ secrets.PROJECT_ID }}
