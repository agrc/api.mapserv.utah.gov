name: Pull Request Events (Developer)

on:
  pull_request:
    paths:
      - "src/developer/**"
      - ".github/workflows/pull_request.developer.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/developer

jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/developer/pnpm-lock.yaml

      - name: Download dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest --run
