name: Pull Request Events (Explorer)

on:
  pull_request:
    paths:
      - "src/explorer/**"
      - ".github/workflows/pull_request.explorer.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/explorer

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: src/explorer/pnpm-lock.yaml

      - name: Download dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
